<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>视觉画廊 · 宇航员视角</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020408;
  --gold: #e2b64f;
  --gold-light: #f0d478;
  --gold-dark: #b8922e;
  --text: #f5f5f7;
  --text2: #a0a0ab;
  --text3: #6a6a78;
  --serif: 'Noto Serif SC', serif;
  --sans: 'Inter', -apple-system, sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 30%, rgba(226,182,79,.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── 导航栏 ── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: rgba(2,4,8,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(226,182,79,.12);
  flex-wrap: wrap;
  gap: 8px;
}

nav a {
  color: var(--text2);
  text-decoration: none;
  font-size: 13px;
  font-weight: 300;
  transition: color .25s;
  white-space: nowrap;
}

nav a:hover { color: var(--gold); }

nav a.active { color: var(--gold); font-weight: 600; }

nav .nav-back { color: var(--gold-light); font-size: 14px; font-weight: 500; }

nav .nav-links {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* ── 主容器 ── */
main {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 20px 60px;
}

/* ── 标题 ── */
header { margin-bottom: 24px; }

h1 {
  font-family: var(--serif);
  font-size: 2.4em;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: .04em;
  margin-bottom: 4px;
  text-shadow: 0 0 60px rgba(226,182,79,.15);
}

.subtitle {
  color: var(--text2);
  font-size: 15px;
  font-weight: 300;
}

/* ── 分类标签 ── */
.categories {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.cat-tag {
  padding: 6px 16px;
  border: 1px solid rgba(226,182,79,.25);
  border-radius: 20px;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  transition: all .25s;
  background: transparent;
}

.cat-tag:hover,
.cat-tag.active {
  background: rgba(226,182,79,.12);
  color: var(--gold);
  border-color: var(--gold);
}

/* ── 主图舞台 ── */
.main-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 800/450;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
  background: #000;
  box-shadow: 0 4px 32px rgba(0,0,0,.5);
}

.main-stage img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .45s ease;
}

.main-stage img.fading { opacity: .15; }

/* ── 缩略图 ── */
.thumbnails {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--text3) transparent;
}

.thumbnails::-webkit-scrollbar { height: 4px; }

.thumbnails::-webkit-scrollbar-thumb {
  background: var(--text3);
  border-radius: 2px;
}

.thumb {
  flex-shrink: 0;
  width: 110px;
  aspect-ratio: 800/450;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color .25s, opacity .25s;
  opacity: .55;
  position: relative;
}

.thumb:hover { opacity: .85; }

.thumb.active { border-color: var(--gold); opacity: 1; }

.thumb img { width: 100%; height: 100%; object-fit: cover; }

.thumb.hidden { display: none; }

/* ── 信息面板 ── */
.info-panel {
  background: rgba(226,182,79,.04);
  border: 1px solid rgba(226,182,79,.1);
  border-radius: 10px;
  padding: 20px 24px;
  min-height: 120px;
}

.info-panel h3 {
  font-family: var(--serif);
  font-size: 1.2em;
  color: var(--gold-light);
  margin-bottom: 4px;
}

.info-panel .meta {
  color: var(--text3);
  font-size: 12px;
  margin-bottom: 10px;
  font-family: var(--sans);
}

.info-panel .desc {
  color: var(--text2);
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 8px;
}

.info-panel .philosophy {
  color: var(--gold);
  font-size: 13px;
  font-style: italic;
  font-family: var(--serif);
  border-left: 2px solid var(--gold-dark);
  padding-left: 12px;
  margin-top: 8px;
}

/* ── 自动播放 ── */
.play-btn {
  background: rgba(226,182,79,.08);
  border: 1px solid rgba(226,182,79,.2);
  color: var(--gold-light);
  padding: 6px 16px;
  border-radius: 18px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 13px;
  margin-left: 8px;
  transition: all .25s;
  white-space: nowrap;
}
.play-btn:hover { background: rgba(226,182,79,.15); }
.play-btn.playing { background: rgba(226,182,79,.2); border-color: var(--gold); }
.play-progress {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,.05);
  margin-top: 10px;
  border-radius: 2px;
  overflow: hidden;
  opacity: 0;
  transition: opacity .3s;
}
.play-progress.active { opacity: 1; }
.play-progress .fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  width: 0%;
  transition: width .3s linear;
}

/* ── 响应式 ── */
@media (max-width: 640px) {
  nav { padding: 12px 16px; }
  nav .nav-links { gap: 8px; font-size: 12px; }
  h1 { font-size: 1.6em; }
  .main-stage { border-radius: 6px; }
  .thumb { width: 80px; }
  .info-panel { padding: 14px 16px; }
}
</style>
</head>

  <div class="info-panel" id="info"></div>
</main>

<script>
// ── DATA ──
var gallery=[
{id:0,cat:['earthrise'],title:'地出 (Earthrise)',meta:'1968年12月24日 · 阿波罗8号 · 威廉·安德斯拍摄',desc:'人类第一次从月球轨道看到地球升起。在荒芜、死寂的灰色月面之上，一颗蓝色与白色交织的星球正缓缓升起——那是我们唯一的家园。这张照片被认为是史上最有影响力的环境照片，直接推动了现代环保运动的诞生。',philo:'「我们来到月球探索，却发现了地球。那个瞬间，一切都改变了。」—— 威廉·安德斯'},
{id:1,cat:['marble'],title:'蓝色弹珠 (The Blue Marble)',meta:'1972年12月7日 · 阿波罗17号',desc:'完整的地球正面——蔚蓝海洋、旋卷白云与翠绿大陆交织成一颗完美的生命之球。这是人类历史上传播最广的照片。在那个距离上，你看不到任何国界、任何战争、任何纷争——只有一颗完整的、活着的星球在宇宙的黑暗中缓缓转动。',philo:'「伸出手用拇指遮住它的时候，你才意识到它有多小、多脆弱。」—— 尤金·塞尔南'},
{id:2,cat:['station'],title:'第一个太空自拍',meta:'1966年6月 · 双子星10号 · 迈克尔·柯林斯',desc:'迈克尔·柯林斯在太空行走中拍下了这张独特的「自拍」——他头盔的面窗中清晰地反射出蓝色的地球。人类第一次在太空中看见自己，而地球成为了这面镜子里的倒影。这张照片是自我与宇宙的第一次视觉对话：我们注视宇宙，宇宙也通过我们的目光注视着自己。',philo:'「看向自己的倒影，看见的是整个家园。那一刻你明白：你与这颗星球从未分离。」'},
{id:3,cat:['station'],title:'无系留太空行走',meta:'1984年2月7日 · 挑战者号航天飞机 · 布鲁斯·麦坎德利斯',desc:'麦坎德利斯解开安全绳，成为第一个不系绳索进行太空行走的人。他独自漂浮在深邃的太空中，背对着弧形的蓝色地球。没有任何连接，没有任何保护——只有一个人和无限的虚空。这幅画面成为关于人类存在意义最震撼的视觉追问。',philo:'「真正的自由，不是不受束缚，而是与深渊对视时内心的平静。」'},
{id:4,cat:['dot'],title:'暗淡蓝点 (Pale Blue Dot)',meta:'1990年2月14日 · 旅行者1号 · 距离地球60亿公里',desc:'在太阳系的边缘，旅行者1号调转相机，拍下了最后一张照片。在那道散射的阳光带中，有一个不到一个像素大小的淡蓝色光点——那就是地球。你所爱的每一个人、你认识的每一个人、你听说过的每一个人、曾经存在过的每一个人，都在那个微小的像素上度过了一生。',philo:'「再看看那个点。就在那里。那是家。那是我们。所有的英雄与懦夫，所有的创造者与毁灭者，所有的国王与农夫——都在那颗悬浮于阳光中的微尘之上。」—— 卡尔·萨根'},
{id:5,cat:['station'],title:'国际空间站穹顶舱',meta:'2010年至今 · 国际空间站',desc:'穹顶舱的七扇窗户是人类在太空中最好的观景台。透过圆形的窗口，地球的弧线横跨整个视野。蓝色的大气层薄如蝉翼，保护着这颗星球上的一切生命——所有的鸟鸣、所有的花开、所有的爱与被爱，都被这层脆弱的光晕温柔地怀抱着。',philo:'「从穹顶舱望出去，你不会想征服什么。你只会想守护。」'},
{id:6,cat:['station'],title:'神舟五号俯瞰',meta:'2003年10月15日 · 神舟五号 · 杨利伟',desc:'杨利伟成为中国第一位进入太空的航天员，在21小时23分钟的飞行中，他透过飞船的舷窗看到了近地轨道上地球壮丽的弧线。蓝色海洋与白色大气层交织，这是属于中国人的太空第一眼——也是人类总观效应地图上一个新的坐标。',philo:'「从飞船的窗口望出去，地球没有国界。那个时候你会感到，人类应该和平共处。」—— 杨利伟'},
{id:7,cat:['station'],title:'东方地平线 · 轨道日出',meta:'国际空间站 · 每90分钟一次日出',desc:'在国际空间站上，每90分钟就能看到一次日出——每天16次。金色的阳光沿着地球的边缘缓缓扩散，大气层像一条燃烧的丝带环绕着蓝色的星球。每一次轨道日出都是宇宙写给这颗行星的情诗，而空间站的宇航员是全球唯一能阅读它的人。',philo:'「每一次轨道日出都在提醒你：黑暗之后必有光明。这是宇宙最古老的承诺。」'}
];

var W=800,H=450,HR_W=1000,HR_H=562;
var catMap={all:[0,1,2,3,4,5,6,7],earthrise:[0],marble:[1],dot:[4],station:[2,3,5,6,7]};

// ── CANVAS HELPERS ──
function stars(ctx,w,h,n,rng){
  var r=rng||Math.random;
  for(var i=0;i<n;i++){
    var x=r()*w,y=r()*h,s=r()*1.2+.3,o=.3+r()*.7;
    ctx.fillStyle='rgba(255,255,255,'+o+')';
    ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();
  }
}

function earth(ctx,cx,cy,r){
  // Ocean base
  var g=ctx.createRadialGradient(cx-r*.25,cy-r*.25,r*.05,cx,cy,r);
  g.addColorStop(0,'#5b9ecf');g.addColorStop(.35,'#2e6ea5');g.addColorStop(.7,'#154575');g.addColorStop(1,'#0a2a45');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  // Clip
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  // Clouds
  ctx.fillStyle='rgba(255,255,255,.22)';
  for(var i=0;i<12;i++){
    var ax=cx-r+Math.random()*r*2,ay=cy-r*.6+Math.random()*r*1.2;
    ctx.beginPath();ctx.ellipse(ax,ay,r*(.3+Math.random()*.5),r*(.06+Math.random()*.12),Math.random()*Math.PI,0,Math.PI*2);ctx.fill();
  }
  // Land masses
  ctx.fillStyle='rgba(80,155,80,.4)';
  for(var i=0;i<8;i++){
    var ax=cx-r*.4+Math.random()*r*.8,ay=cy-r*.2+Math.random()*r*.4;
    ctx.beginPath();ctx.ellipse(ax,ay,r*(.1+Math.random()*.25),r*(.08+Math.random()*.2),Math.random()*Math.PI,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // Atmosphere rim
  var ag=ctx.createRadialGradient(cx,cy,r*.85,cx,cy,r*1.12);
  ag.addColorStop(0,'rgba(90,170,230,0)');ag.addColorStop(.5,'rgba(90,170,230,.18)');ag.addColorStop(1,'rgba(90,170,230,0)');
  ctx.beginPath();ctx.arc(cx,cy,r*1.12,0,Math.PI*2);ctx.fillStyle=ag;ctx.fill();
}

// ── SCENE GENERATORS ──
function genAll(){
  var scenes=[];
  var svr=Date.now();
  for(var s=0;s<8;s++){
    var c=document.createElement('canvas');c.width=W;c.height=H;
    var ctx=c.getContext('2d');
    var sr=function(){var x=Math.sin(svr+s*999)*9301+Math.cos(svr+s*7777)*4921;return(x-Math.floor(x));};
    // Shared starfield
    ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);
    stars(ctx,W,H,220,sr);
    switch(s){
    case 0:{// Earthrise
      ctx.fillStyle='#1a1a1e';
      ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(80,H-60);ctx.lineTo(200,H-90);ctx.lineTo(320,H-70);ctx.lineTo(420,H-55);ctx.lineTo(560,H-80);ctx.lineTo(700,H-45);ctx.lineTo(800,H-50);ctx.lineTo(800,H);ctx.closePath();ctx.fill();
      var cx2=580,cy2=180,r2=110;
      earth(ctx,cx2,cy2,r2);
      ctx.save();
      ctx.beginPath();ctx.moveTo(0,400);ctx.lineTo(800,400);ctx.lineTo(800,0);ctx.lineTo(0,0);ctx.closePath();ctx.clip();
      var ag2=ctx.createRadialGradient(cx2,cy2,r2*.85,cx2,cy2,r2*1.12);
      ag2.addColorStop(0,'rgba(90,170,230,0)');ag2.addColorStop(.5,'rgba(90,170,230,.18)');ag2.addColorStop(1,'rgba(90,170,230,0)');
      ctx.beginPath();ctx.arc(cx2,cy2,r2*1.12,0,Math.PI*2);ctx.fillStyle=ag2;ctx.fill();
      ctx.restore();
      var ag3=ctx.createRadialGradient(cx2,cy2,r2*.88,cx2,cy2,r2*1.1);
      ag3.addColorStop(0,'rgba(100,190,240,0)');ag3.addColorStop(.4,'rgba(100,190,240,.15)');ag3.addColorStop(1,'rgba(100,190,240,0)');
      ctx.beginPath();ctx.arc(cx2,cy2,r2*1.1,0,Math.PI*2);ctx.fillStyle=ag3;ctx.fill();
      break;}
    case 1:{// Blue Marble
      earth(ctx,W/2,H/2,175);
      break;}
    case 2:{// Space Selfie
      ctx.strokeStyle='#333';ctx.lineWidth=14;
      ctx.beginPath();ctx.arc(W/2,H/2,130,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#222';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(W/2,H/2,137,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(W/2,H/2,123,0,Math.PI*2);ctx.stroke();
      ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,123,0,Math.PI*2);ctx.clip();
      earth(ctx,W/2,H/2+15,80);
      ctx.fillStyle='rgba(255,255,255,.08)';
      ctx.beginPath();ctx.ellipse(W/2-30,H/2-50,50,15,-.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.05)';
      ctx.beginPath();ctx.ellipse(W/2+20,H/2-60,30,10,.3,0,Math.PI*2);ctx.fill();
      ctx.restore();
      ctx.fillStyle='rgba(10,10,14,.9)';ctx.beginPath();ctx.rect(0,0,W,H);ctx.fill();
      ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,130,0,Math.PI*2);ctx.clip();
      ctx.fillStyle='rgba(2,4,8,0)';ctx.fillRect(0,0,W,H);
      ctx.restore();
      ctx.strokeStyle='#3a3a44';ctx.lineWidth=12;
      ctx.beginPath();ctx.arc(W/2,H/2,130,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#444';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(W/2,H/2,137,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(W/2,H/2,123,0,Math.PI*2);ctx.stroke();
      break;}
    case 3:{// Spacewalk
      earth(ctx,100,280,290);
      ctx.fillStyle='#020408';ctx.fillRect(320,0,480,H);
      var ax=520,ay=160;
      ctx.fillStyle='#f0f0f5';
      ctx.beginPath();ctx.arc(ax,ay-8,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e8e8ee';
      ctx.fillRect(ax-4,ay-1,8,14);
      ctx.fillStyle='#ddd';
      ctx.fillRect(ax-8,ay+13,4,4);ctx.fillRect(ax+4,ay+13,4,4);
      ctx.fillRect(ax-10,ay,4,10);ctx.fillRect(ax+6,ay,4,10);
      ctx.fillStyle='#ccc';ctx.fillRect(ax-6,ay-2,12,12);
      ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=.6;
      ctx.beginPath();ctx.moveTo(ax-6,ay+6);ctx.quadraticCurveTo(ax-40,ay+50,ax-80,ay+90);ctx.stroke();
      break;}
    case 4:{// Pale Blue Dot
      ctx.fillStyle='#010206';ctx.fillRect(0,0,W,H);
      for(var i=0;i<80;i++){var sx=sr()*W,sy=sr()*H,ss=sr()*.8+.2,so=.1+sr()*.4;
        ctx.fillStyle='rgba(255,255,255,'+so+')';ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fill();}
      var lg=ctx.createLinearGradient(150,100,650,350);
      lg.addColorStop(0,'rgba(255,200,100,0)');lg.addColorStop(.45,'rgba(255,180,60,.03)');lg.addColorStop(.5,'rgba(255,220,140,.06)');lg.addColorStop(.55,'rgba(255,180,60,.03)');lg.addColorStop(1,'rgba(255,200,100,0)');
      ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(100,60);ctx.lineTo(700,380);ctx.lineTo(720,400);ctx.lineTo(120,80);ctx.closePath();ctx.fill();
      for(var i=0;i<5;i++){
        var oy=200+(i-2)*28;
        var lg2=ctx.createLinearGradient(100,oy,720,oy+240);
        lg2.addColorStop(0,'rgba(255,200,100,0)');lg2.addColorStop(.48,'rgba(200,150,60,.015)');lg2.addColorStop(.52,'rgba(255,200,100,.025)');lg2.addColorStop(1,'rgba(255,200,100,0)');
        ctx.fillStyle=lg2;ctx.fillRect(0,oy-3,W,10);
      }
      var dx=430,dy=258;
      var dg=ctx.createRadialGradient(dx,dy,0,dx,dy,5);
      dg.addColorStop(0,'rgba(180,210,255,.9)');dg.addColorStop(.3,'rgba(140,180,240,.5)');dg.addColorStop(.7,'rgba(100,150,220,.08)');dg.addColorStop(1,'rgba(100,150,220,0)');
      ctx.fillStyle=dg;ctx.beginPath();ctx.arc(dx,dy,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(210,230,255,.7)';ctx.beginPath();ctx.arc(dx,dy,1.3,0,Math.PI*2);ctx.fill();
      break;}
    case 5:{// ISS Cupola
      ctx.fillStyle='#0a0a10';ctx.fillRect(0,0,W,H);
      ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,130,0,Math.PI*2);ctx.clip();
      stars(ctx,W,H,60,sr);
      earth(ctx,W/2+20,H/2+70,200);
      ctx.restore();
      var fw=18;
      ctx.strokeStyle='#2a2a32';ctx.lineWidth=fw;
      ctx.beginPath();ctx.arc(W/2,H/2,130,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#1a1a22';ctx.lineWidth=fw+6;
      ctx.beginPath();ctx.arc(W/2,H/2,130,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#1a1a22';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(W/2,100);ctx.lineTo(W/2,350);ctx.stroke();
      ctx.beginPath();ctx.moveTo(270,H/2);ctx.lineTo(530,H/2);ctx.stroke();
      ctx.fillStyle='#111118';
      ctx.fillRect(0,0,200,H);ctx.fillRect(600,0,200,H);
      ctx.fillRect(0,0,W,80);ctx.fillRect(0,370,W,80);
      ctx.strokeStyle='#1a1a26';ctx.lineWidth=24;
      ctx.beginPath();ctx.arc(W/2,H/2,148,0,Math.PI*2);ctx.stroke();
      break;}
    case 6:{// Shenzhou 5
      stars(ctx,W,H,180,sr);
      var cx7=W/2,cy7=H+80,r7=400;
      ctx.save();ctx.beginPath();ctx.arc(cx7,cy7,r7,0,Math.PI*2);ctx.clip();
      var g7=ctx.createRadialGradient(cx7-50,cy7-80,r7*.2,cx7,cy7,r7);
      g7.addColorStop(0,'#4a8ec0');g7.addColorStop(.35,'#2a65a0');g7.addColorStop(.7,'#154575');g7.addColorStop(1,'#0a2a45');
      ctx.fillStyle=g7;ctx.beginPath();ctx.arc(cx7,cy7,r7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.18)';
      for(var i=0;i<15;i++){var ax=cx7-r7*.5+sr()*r7,ay=cy7-r7*.4+sr()*r7*.5;
        ctx.beginPath();ctx.ellipse(ax,ay,r7*(.1+sr()*.3),r7*(.02+sr()*.04),sr()*Math.PI,0,Math.PI*2);ctx.fill();}
      ctx.restore();
      var ag7=ctx.createRadialGradient(cx7,cy7,r7*.92,cx7,cy7,r7*1.04);
      ag7.addColorStop(0,'rgba(100,190,240,0)');ag7.addColorStop(.5,'rgba(120,200,245,.25)');ag7.addColorStop(1,'rgba(100,190,240,0)');
      ctx.beginPath();ctx.arc(cx7,cy7,r7*1.04,0,Math.PI*2);ctx.fillStyle=ag7;ctx.fill();
      var wv=ctx.createRadialGradient(W/2,H/2,200,W/2,H/2,500);
      wv.addColorStop(0,'rgba(0,0,0,0)');wv.addColorStop(.55,'rgba(0,0,0,0)');wv.addColorStop(1,'rgba(0,0,0,.85)');
      ctx.fillStyle=wv;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(2,2,6,.9)';ctx.fillRect(0,0,30,H);ctx.fillRect(W-30,0,30,H);ctx.fillRect(0,0,W,20);ctx.fillRect(0,H-20,W,20);
      break;}
    case 7:{// Eastern Horizon
      var sgg=ctx.createLinearGradient(0,0,0,H);
      sgg.addColorStop(0,'#020412');sgg.addColorStop(.5,'#0a1a3a');sgg.addColorStop(.75,'#1a3560');sgg.addColorStop(.9,'#2a5080');sgg.addColorStop(1,'#356090');
      ctx.fillStyle=sgg;ctx.fillRect(0,0,W,H);
      stars(ctx,W,H,100,sr);
      var cx8=W/2,cy8=H+350,r8=480;
      var ag8=ctx.createRadialGradient(cx8,cy8,r8*.88,cx8,cy8,r8*1.04);
      ag8.addColorStop(0,'rgba(255,180,60,0)');ag8.addColorStop(.15,'rgba(255,160,40,.08)');ag8.addColorStop(.3,'rgba(255,140,30,.25)');ag8.addColorStop(.45,'rgba(240,120,20,.45)');ag8.addColorStop(.6,'rgba(220,100,15,.6)');ag8.addColorStop(.8,'rgba(200,80,10,.35)');ag8.addColorStop(1,'rgba(180,60,5,0)');
      ctx.fillStyle=ag8;ctx.beginPath();ctx.arc(cx8,cy8,r8*1.04,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.beginPath();ctx.arc(cx8,cy8,r8,0,Math.PI*2);ctx.clip();
      var eg8=ctx.createRadialGradient(cx8-40,cy8-100,r8*.15,cx8,cy8,r8);
      eg8.addColorStop(0,'#3a6080');eg8.addColorStop(.4,'#1a3a5a');eg8.addColorStop(.8,'#0a1a30');eg8.addColorStop(1,'#020812');
      ctx.fillStyle=eg8;ctx.beginPath();ctx.arc(cx8,cy8,r8,0,Math.PI*2);ctx.fill();
      ctx.restore();
      var shg=ctx.createRadialGradient(cx8,cy8-r8*.92,10,cx8,cy8-r8*.85,80);
      shg.addColorStop(0,'rgba(255,240,200,.9)');shg.addColorStop(.2,'rgba(255,200,120,.5)');shg.addColorStop(.5,'rgba(255,150,50,.15)');shg.addColorStop(1,'rgba(255,100,30,0)');
      ctx.fillStyle=shg;
      ctx.beginPath();ctx.arc(cx8,cy8-r8*.92,80,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,200,140,.15)';
      for(var i=0;i<6;i++){ctx.beginPath();ctx.ellipse(cx8-100+i*50,cy8-r8*.88+sr()*15,r8*(.1+sr()*.2),r8*.01,0,0,Math.PI*2);ctx.fill();}
      break;}
    }
    var hr=document.createElement('canvas');hr.width=HR_W;hr.height=HR_H;
    var hctx=hr.getContext('2d');hctx.drawImage(c,0,0,HR_W,HR_H);
    scenes.push(hr.toDataURL('image/jpeg',.92));
  }
  return scenes;
}

// ── APP ──
var images=genAll();
var curIdx=0,curCat='all';
var mainImg=document.getElementById('mainImg');
var thumbs=document.getElementById('thumbs');
var info=document.getElementById('info');

function filtered(){ return catMap[curCat]; }

function updateDisplay(idx){
  curIdx=idx;
  var list=filtered();
  var realIdx=list[idx];
  mainImg.classList.add('fading');
  setTimeout(function(){
    mainImg.src=images[realIdx];
    mainImg.classList.remove('fading');
  },200);
  var thumbEls=[].slice.call(thumbs.children);
  thumbEls.forEach(function(t,i){
    t.classList.toggle('active',i===idx);
  });
  var d=gallery[realIdx];
  info.innerHTML='<h3>'+d.title+'</h3><div class="meta">'+d.meta+'</div><div class="desc">'+d.desc+'</div><div class="philosophy">'+d.philosophy+'</div>';
}

function switchCat(cat){
  curCat=cat;
  var list=filtered();
  thumbs.innerHTML='';
  list.forEach(function(gi,i){
    var t=document.createElement('div');
    t.className='thumb'+(i===0?' active':'');
    t.innerHTML='<img src="'+images[gi]+'" alt="">';
    t.addEventListener('click',(function(ii){return function(){updateDisplay(ii);}})(i));
    thumbs.appendChild(t);
  });
  curIdx=0;
  updateDisplay(0);
}

// Init
switchCat('all');

// Category clicks
var tags=document.querySelectorAll('.cat-tag');
for(var i=0;i<tags.length;i++){
  tags[i].addEventListener('click',function(){
    var allTags=document.querySelectorAll('.cat-tag');
    for(var j=0;j<allTags.length;j++){allTags[j].classList.remove('active');}
    this.classList.add('active');
    switchCat(this.dataset.cat);
  });
}

// Keyboard
document.addEventListener('keydown',function(e){
  var list=filtered();
  if(e.key==='ArrowLeft'){e.preventDefault();curIdx=(curIdx-1+list.length)%list.length;updateDisplay(curIdx);stopAuto();}
  if(e.key==='ArrowRight'){e.preventDefault();curIdx=(curIdx+1)%list.length;updateDisplay(curIdx);stopAuto();}
});

// ── AUTO-PLAY ──
var autoTimer=null,autoInterval=6000,autoStart=0;
var playBtn=document.getElementById('playBtn');
var playProgress=document.getElementById('playProgress');
var playFill=document.getElementById('playFill');

function stopAuto(){
  if(autoTimer){clearInterval(autoTimer);clearTimeout(autoTimer);autoTimer=null;}
  playBtn.textContent='▶ 自动播放';
  playBtn.classList.remove('playing');
  playProgress.classList.remove('active');
  playFill.style.width='0%';
}

function stepAuto(){
  var list=filtered();
  curIdx=(curIdx+1)%list.length;
  updateDisplay(curIdx);
  autoStart=Date.now();
  playFill.style.transition='none';playFill.style.width='0%';
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      playFill.style.transition='width '+(autoInterval/1000)+'s linear';
      playFill.style.width='100%';
    });
  });
}

function startAuto(){
  if(autoTimer)return;
  var list=filtered();
  if(list.length<=1)return;
  playBtn.textContent='⏸ 暂停';
  playBtn.classList.add('playing');
  playProgress.classList.add('active');
  autoStart=Date.now();
  playFill.style.transition='none';playFill.style.width='0%';
  playFill.offsetHeight;
  playFill.style.transition='width '+(autoInterval/1000)+'s linear';
  playFill.style.width='100%';
  autoTimer=setInterval(stepAuto,autoInterval);
}

playBtn.addEventListener('click',function(){
  if(autoTimer){stopAuto();}else{startAuto();}
});

// Pause auto-play on any manual interaction
var mainStage=document.querySelector('.main-stage');
mainStage.addEventListener('click',function(){if(autoTimer)stopAuto();});
thumbs.addEventListener('click',function(e){if(e.target.closest('.thumb')&&autoTimer)stopAuto();});
</script>
