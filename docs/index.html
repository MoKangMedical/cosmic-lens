  <style>

    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--text); }

    #cosmos { position: fixed; inset: 0; z-index: 0; }

      position: fixed; inset: 0; z-index: 10;

    .brand-mark {

      display: grid; place-items: center; font-size: 1.3rem;

    .brand-text span {

    .nav-links a {

    .nav-links a:hover {

// ── Scene setup ──
const container = document.getElementById('cosmos');

const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.3, 300);

// ══════════════════════════════════════════════════════
//  CANVAS TEXTURE GENERATION for nebulae
// ══════════════════════════════════════════════════════
function createGlowTexture(innerColor, outerColor, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  gradient.addColorStop(0, innerColor);
  gradient.addColorStop(0.3, innerColor);
  gradient.addColorStop(0.7, outerColor);
  gradient.addColorStop(1, 'transparent');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

function createNebulaSprite(texture, color, size, opacity) {
  const mat = new THREE.SpriteMaterial({
    map: texture,
    color: color,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: opacity,
  });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(size, size, 1);
  return sprite;
}

// Generate textures
const goldGlowTex = createGlowTexture('rgba(226,182,79,0.8)', 'rgba(226,182,79,0)', 256);
const purpleGlowTex = createGlowTexture('rgba(107,92,231,0.7)', 'rgba(107,92,231,0)', 256);
const blueGlowTex = createGlowTexture('rgba(60,100,220,0.6)', 'rgba(40,60,180,0)', 256);
const pinkGlowTex = createGlowTexture('rgba(200,80,150,0.5)', 'rgba(180,60,130,0)', 256);
const softGlowTex = createGlowTexture('rgba(180,180,220,0.4)', 'rgba(100,100,160,0)', 256);

// ══════════════════════════════════════════════════════
//  GALAXY: Spiral Disk + Arms + Core
// ══════════════════════════════════════════════════════

// -- Galactic disk (thin flat layer of background stars) --
function createGalacticDisk(innerRadius, outerRadius, count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    // Bias toward center with sqrt distribution
    const r = innerRadius + Math.random() * (outerRadius - innerRadius);
    pos[i * 3] = Math.cos(angle) * r;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 1.2;
    pos[i * 3 + 2] = Math.sin(angle) * r;

    // Dim blue-white
    const b = 0.5 + Math.random() * 0.5;
    colors[i * 3] = 0.5 + b * 0.3;
    colors[i * 3 + 1] = 0.5 + b * 0.35;
    colors[i * 3 + 2] = 0.6 + b * 0.4;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.08,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.5,
  });
  return new THREE.Points(geo, mat);
}

const disk = createGalacticDisk(1.5, 18, 6000);
disk.rotation.x = -Math.PI * 0.42;
disk.position.y = 1;
scene.add(disk);

// -- Spiral Arms (4 main arms using logarithmic spiral) --
function createSpiralArm(armOffset, count, spread, armColor, lengthScale) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  const colorObj = new THREE.Color(armColor);

  for (let i = 0; i < count; i++) {
    // Logarithmic spiral: r = a * e^(b*theta)
    const t = i / count; // 0 to 1 from center to edge
    const angle = armOffset + t * Math.PI * 2.4; // ~1.2 full turns
    const r = 0.6 + t * 16 * lengthScale;

    // Spread perpendicular to spiral
    const spreadAmount = (Math.random() - 0.5) * spread * (0.3 + t * 1.0);
    const perpAngle = angle + Math.PI / 2;

    pos[i * 3] = Math.cos(angle) * r + Math.cos(perpAngle) * spreadAmount;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.6 * (0.3 + t * 1.0);
    pos[i * 3 + 2] = Math.sin(angle) * r + Math.sin(perpAngle) * spreadAmount;

    // Color: brighter toward center, dimmer toward edge
    const brightness = 1.0 - t * 0.6;
    colors[i * 3] = colorObj.r * brightness;
    colors[i * 3 + 1] = colorObj.g * brightness;
    colors[i * 3 + 2] = colorObj.b * brightness;
    sizes[i] = (0.04 + Math.random() * 0.1) * (1.2 - t * 0.8);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Use ShaderMaterial for variable-size points
  const mat = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.75,
  });
  return new THREE.Points(geo, mat);
}

const armsGroup = new THREE.Group();

// 4 spiral arms with different colors
armsGroup.add(createSpiralArm(0, 2500, 1.8, '#ffcc44', 1.0));           // gold arm
armsGroup.add(createSpiralArm(Math.PI / 2, 2500, 1.6, '#eebb33', 0.95)); // warm gold
armsGroup.add(createSpiralArm(Math.PI, 2500, 1.5, '#9977dd', 0.9));      // purple arm
armsGroup.add(createSpiralArm(Math.PI * 1.5, 2500, 1.7, '#aa88ee', 0.85));// light purple

armsGroup.rotation.x = -Math.PI * 0.42;
armsGroup.position.y = 1;
scene.add(armsGroup);

// -- Dust lanes between arms (darker regions) --
function createDustLane(armOffset, count, lengthScale) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const t = i / count;
    const angle = armOffset + Math.PI / 4 + t * Math.PI * 2.2; // offset between arms
    const r = 1.5 + t * 15 * lengthScale;
    const spread = (Math.random() - 0.5) * 3.5 * (0.3 + t);
    const perpAngle = angle + Math.PI / 2;
    pos[i * 3] = Math.cos(angle) * r + Math.cos(perpAngle) * spread;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
    pos[i * 3 + 2] = Math.sin(angle) * r + Math.sin(perpAngle) * spread;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.12,
    color: 0x331133,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.2,
  });
  return new THREE.Points(geo, mat);
}

const dustGroup = new THREE.Group();

//  NEBULAE — large glow sprites

function addNebula(tex, color, pos, size, opacity) {
  const sprite = createNebulaSprite(tex, color, size, opacity);
  sprite.position.copy(pos);
  scene.add(sprite);
  nebulae.push({ sprite, baseOpacity: opacity });
}

addNebula(purpleGlowTex, '#8855cc', new THREE.Vector3(3, -1.5, 6), 12, 0.17);
addNebula(softGlowTex, '#8899cc', new THREE.Vector3(0, 3, -2), 15, 0.12);

function createGlobularCluster(center, radius, count, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = Math.pow(Math.random(), 0.6) * radius; // bias toward center
    pos[i * 3] = center.x + r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = center.y + r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = center.z + r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.06,
    color: color,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.7,
  });
  return new THREE.Points(geo, mat);
}

const clustersGroup = new THREE.Group();
clustersGroup.add(createGlobularCluster(new THREE.Vector3(12, 3, 5), 2.5, 800, '#eebb77'));
clustersGroup.add(createGlobularCluster(new THREE.Vector3(-11, 2, -4), 2.0, 700, '#bb99ee'));
clustersGroup.add(createGlobularCluster(new THREE.Vector3(4, 5, -9), 1.8, 600, '#99ccee'));
clustersGroup.add(createGlobularCluster(new THREE.Vector3(-7, -3, 8), 2.2, 700, '#ffcc88'));

// ══════════════════════════════════════════════════════
//  DEEP BACKGROUND STARS (several layers)
// ══════════════════════════════════════════════════════
function createStarLayer(radius, count, size, opacity, colorMix) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = radius + (Math.random() - 0.5) * radius * 0.6;
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);

    const mix = Math.random();
    if (mix < colorMix[0]) {
      colors[i * 3] = 0.89; colors[i * 3 + 1] = 0.71; colors[i * 3 + 2] = 0.31; // gold
    } else if (mix < colorMix[1]) {
      colors[i * 3] = 0.42; colors[i * 3 + 1] = 0.36; colors[i * 3 + 2] = 0.91; // purple
    } else if (mix < colorMix[2]) {
      colors[i * 3] = 0.5; colors[i * 3 + 1] = 0.7; colors[i * 3 + 2] = 1.0; // blue
    } else {
      const w = 0.6 + Math.random() * 0.4;
      colors[i * 3] = w; colors[i * 3 + 1] = w; colors[i * 3 + 2] = w * 1.05;
    }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size, vertexColors: true, blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, opacity,
  });
  return new THREE.Points(geo, mat);
}

// Layer 1: deepest distant stars
scene.add(createStarLayer(55, 3000, 0.15, 0.5, [0.05, 0.1, 0.2]));
// Layer 2: mid-distance
scene.add(createStarLayer(40, 2500, 0.1, 0.6, [0.08, 0.14, 0.25]));
// Layer 3: nearby bright
scene.add(createStarLayer(28, 1800, 0.08, 0.7, [0.1, 0.18, 0.3]));

// ══════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════

// Central bulge cluster

const bulgeCount = 1500;

const bulgeColors = new Float32Array(bulgeCount * 3);
for (let i = 0; i < bulgeCount; i++) {

  bulgePos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  bulgePos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.4; // flattened

bulgeGeo.setAttribute('position', new THREE.BufferAttribute(bulgePos, 3));
bulgeGeo.setAttribute('color', new THREE.BufferAttribute(bulgeColors, 3));
const bulgeMat = new THREE.PointsMaterial({

// Core glow layers

// ══════════════════════════════════════════════════════
//  COURSE NODES — floating within the galaxy
// ══════════════════════════════════════════════════════
const courseNodes = [];
const courseGroup = new THREE.Group();
scene.add(courseGroup);

// Enhanced spiral distribution — nodes follow galaxy arms
function getCoursePosition(index, phase, totalInPhase) {
  // Phase 0 (gold): along arms 0 and 1 (right side)
  // Phase 1 (purple): along arms 2 and 3 (left side)
  const armBase = phase === 0 ? 0 : Math.PI;
  const t = totalInPhase === 1 ? 0.5 : index / (totalInPhase - 1);
  const armAngle = armBase + t * Math.PI * 1.8;
  const radius = 3 + t * 11;
  const spread = (index % 2 === 0 ? 1 : -1) * (1.2 + t * 1.5);

  const perpAngle = armAngle + Math.PI / 2;
  const flatX = Math.cos(armAngle) * radius + Math.cos(perpAngle) * spread;
  const flatZ = Math.sin(armAngle) * radius + Math.sin(perpAngle) * spread;
  const y = 1.5 + Math.sin(t * Math.PI) * 2 + (phase === 0 ? -0.5 : 1);

  return { x: flatX, y, z: flatZ };
}

const phaseCounts = [10, 10];
const phaseOffsets = [0, 10];

courses.forEach((course, i) => {
  const phase = course.phase;
  const posInPhase = i - phaseOffsets[phase];
  const totalInPhase = phaseCounts[phase];
  const pos = getCoursePosition(posInPhase, phase, totalInPhase);

  const color = phaseColors[phase];

  // Outer glow halo
  const glowGeo = new THREE.SphereGeometry(0.7, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.15,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);

  // Core sphere
  const coreGeo = new THREE.SphereGeometry(0.35, 32, 32);
  const coreMat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.8,
    roughness: 0.3, metalness: 0.5,
  });
  const core = new THREE.Mesh(coreGeo, coreMat);

  // Orbit ring
  const ringGeo = new THREE.TorusGeometry(0.5, 0.04, 16, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.8;

  const group = new THREE.Group();
  group.add(glow);
  group.add(core);
  group.add(ring);
  group.position.set(pos.x, pos.y, pos.z);
  courseGroup.add(group);

  courseNodes.push({
    mesh: group,
    glow,
    core,
    ring,
    course,
    originalScale: 1,
    targetScale: 1,
  });
});

// ══════════════════════════════════════════════════════
//  PHASE CONNECTIONS — constellation lines
// ══════════════════════════════════════════════════════
function drawPhaseConnections() {
  const lineGroup = new THREE.Group();

  [0, 1].forEach(phase => {
    const phaseNodes = courseNodes.filter(n => n.course.phase === phase);

    for (let i = 0; i < phaseNodes.length; i++) {
      for (let j = i + 1; j < phaseNodes.length; j++) {
        const a = phaseNodes[i].mesh.position;
        const b = phaseNodes[j].mesh.position;
        const dist = a.distanceTo(b);
        if (dist > 7) continue;

        const points = [a.clone(), b.clone()];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const lineMat = new THREE.LineBasicMaterial({
          color: phaseColors[phase],
          transparent: true, opacity: 0.05,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const line = new THREE.Line(lineGeo, lineMat);
        line.userData = { phase, opacity: 0.05 };
        lineGroup.add(line);
      }
    }
  });
  scene.add(lineGroup);
  return lineGroup;
}
const phaseLines = drawPhaseConnections();

// ══════════════════════════════════════════════════════
//  FUTURE PHASE PLACEHOLDERS (dim nodes)
// ══════════════════════════════════════════════════════
function createPlaceholderNodes() {
  const group = new THREE.Group();

  // Phase 3: 模拟检测 (21-40) — scattered outer ring
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI * 1.8 + (i / 7) * Math.PI * 0.8;
    const radius = 13 + i * 0.6;
    const pos = {
      x: Math.cos(angle) * radius,
      y: 0.5 + Math.sin(i * 0.8) * 1.5,
      z: Math.sin(angle) * radius - 2,
    };
    const geo = new THREE.SphereGeometry(0.2, 12, 12);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x5566aa, transparent: true, opacity: 0.12,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, pos.y, pos.z);
    group.add(mesh);
  }

  // Phase 4: 意识与伦理 (41-100) — outermost ring
  for (let i = 0; i < 12; i++) {
    const angle = Math.PI * 0.5 + (i / 11) * Math.PI * 0.9;
    const radius = 16 + i * 0.5;
    const pos = {
      x: Math.cos(angle) * radius,
      y: 2 + Math.sin(i * 0.6) * 1.2,
      z: Math.sin(angle) * radius - 2,
    };
    const geo = new THREE.SphereGeometry(0.16, 12, 12);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x556677, transparent: true, opacity: 0.08,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, pos.y, pos.z);
    group.add(mesh);
  }

  scene.add(group);
  return group;
}
const placeholderNodes = createPlaceholderNodes();

// ══════════════════════════════════════════════════════
//  INTERACTION — hover & click
// ══════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.5;
const mouse = new THREE.Vector2();
let hoveredNode = null;
const infoPanel = document.getElementById('infoPanel');
const infoNum = document.getElementById('infoNum');
const infoTitle = document.getElementById('infoTitle');
const infoDesc = document.getElementById('infoDesc');
const infoMeta = document.getElementById('infoMeta');

function updateInfoPanel(node, screenX, screenY) {
  if (!node) {
    infoPanel.classList.remove('active');
    return;
  }
  const c = node.course;
  infoNum.textContent = `第 ${c.id} 课 · Phase ${c.phase + 1}`;
  infoTitle.textContent = c.title;
  infoDesc.textContent = c.desc;
  infoMeta.textContent = `${c.time} · 5章 · 5练习`;
  infoPanel.style.left = screenX + 'px';
  infoPanel.style.top = screenY + 'px';
  infoPanel.classList.add('active');
}

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(
    courseNodes.map(n => n.core), false
  );

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const node = courseNodes.find(n => n.core === obj || n.glow === obj || n.ring === obj);
    if (node) {
      if (hoveredNode !== node) {
        if (hoveredNode) {
          hoveredNode.targetScale = 1;
          hoveredNode.glow.material.opacity = 0.15;
        }
        hoveredNode = node;
        node.targetScale = 2.0;
        node.glow.material.opacity = 0.55;
        document.body.style.cursor = 'pointer';
      }
      updateInfoPanel(node, e.clientX, e.clientY);
      return;
    }
  }

  if (hoveredNode) {
    hoveredNode.targetScale = 1;
    hoveredNode.glow.material.opacity = 0.15;
    hoveredNode = null;
  }
  document.body.style.cursor = 'default';
  updateInfoPanel(null);
});

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(
    courseNodes.map(n => n.core), false
  );

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const node = courseNodes.find(n => n.core === obj || n.glow === obj || n.ring === obj);
    if (node) {
      const id = String(node.course.id).padStart(2, '0');
      window.location.href = `lesson${id}.html`;
    }
  }
});

// ══════════════════════════════════════════════════════
//  ANIMATION LOOP
// ══════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  controls.update();

  // Smooth node scale transitions
  courseNodes.forEach(node => {
    const current = node.mesh.scale.x;
    const target = node.targetScale;
    node.mesh.scale.setScalar(current + (target - current) * 0.12);
    node.ring.rotation.z += 0.004;
    node.ring.rotation.x += 0.0015;
  });

  // Pulse central core
  const pulse = 1 + Math.sin(t * 0.7) * 0.2;
  coreGlowOuter.scale.setScalar(pulse);
  coreGlowMid.scale.setScalar(pulse * 1.1);
  coreGlowInner.scale.setScalar(pulse * 1.15);
  innerCore.material.emissiveIntensity = 1.8 + Math.sin(t * 1.1) * 0.6;

  // Slowly rotate background star layers
  scene.children.forEach(child => {
    if (child.type === 'Points' && !child.isNodeRelated) {
      // slight rotation on deep star layers
    }
  });

  // Subtle nebula pulsing
  nebulae.forEach((n, i) => {
    n.sprite.material.opacity = n.baseOpacity * (0.85 + Math.sin(t * 0.3 + i) * 0.15);
    n.sprite.scale.x = n.sprite.scale.y * (1 + Math.sin(t * 0.25 + i * 1.5) * 0.03);
  });

  // Rotate spiral arms very slowly
  armsGroup.rotation.z += 0.0001;
  dustGroup.rotation.z += 0.00008;

  // Connection lines fade with camera distance
  const camDist = camera.position.length();
  phaseLines.children.forEach(line => {
    line.material.opacity = line.userData.opacity * Math.min(1, 22 / camDist);
  });

  renderer.render(scene, camera);
}

animate();

// ── Responsive ──
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ── Touch support ──
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
  }
}, { passive: true });
