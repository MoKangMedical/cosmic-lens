<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇宙之镜 · Cosmic Lens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020408;
      --gold: #e2b64f;
      --gold-light: #f0d478;
      --gold-dark: #b8922e;
      --text: #f5f5f7;
      --text2: #a0a0ab;
      --serif: 'Noto Serif SC', serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--text); }

    #cosmos { position: fixed; inset: 0; z-index: 0; }

    /* Overlay */
    .overlay {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 28px 36px 24px;
    }
    .overlay > * { pointer-events: auto; }

    /* Top bar */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--text);
    }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 14px;
      display: grid; place-items: center; font-size: 1.3rem;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.75), transparent 16%),
                  linear-gradient(135deg, var(--gold), #6b5ce7);
      box-shadow: 0 0 32px rgba(226,182,79,0.35);
    }
    .brand-text { line-height: 1.15; }
    .brand-text strong {
      display: block; font-size: 1.02rem; letter-spacing: 0;
      font-family: var(--serif);
    }
    .brand-text span {
      font-size: 0.68rem; color: var(--text2); text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .nav-links { display: flex; gap: 6px; }
    .nav-links a {
      color: var(--text2); text-decoration: none; font-size: 0.85rem;
      padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.25s;
    }
    .nav-links a:hover {
      color: var(--text); background: rgba(255,255,255,0.1);
      border-color: rgba(226,182,79,0.25);
    }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 0 20px;
      border-radius: 999px; font-size: 0.85rem; font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #111; border: none;
      box-shadow: 0 8px 28px rgba(226,182,79,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 12px 36px rgba(226,182,79,0.35); }

    /* Bottom info */
    .bottom-bar {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px;
    }
    .hero-title {
      font-family: var(--serif); font-weight: 900;
      font-size: clamp(2.4rem, 5.5vw, 4.8rem);
      line-height: 1.05; letter-spacing: 0;
      text-shadow: 0 0 60px rgba(226,182,79,0.25);
    }
    .hero-title span { color: var(--gold); }
    .hero-sub {
      margin-top: 10px; color: var(--text2); font-size: 0.95rem;
      max-width: 520px; line-height: 1.5;
    }

    /* Phase legend */
    .legend {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.75rem; color: var(--text2);
      background: rgba(10,10,16,0.8); padding: 6px 14px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,0.06);
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* Course info tooltip */
    .info-panel {
      position: fixed; z-index: 20;
      pointer-events: none; opacity: 0;
      transform: translate(-50%, -130%);
      background: rgba(12,12,20,0.92);
      border: 1px solid rgba(226,182,79,0.2);
      border-radius: 16px; padding: 18px 22px;
      max-width: 320px;
      transition: opacity 0.2s;
      backdrop-filter: blur(16px);
    }
    .info-panel.active { opacity: 1; }
    .info-panel .num {
      font-size: 0.7rem; color: var(--gold);
      text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 4px;
    }
    .info-panel h3 {
      font-family: var(--serif); font-size: 1.05rem;
      color: var(--gold); line-height: 1.3; margin-bottom: 6px;
    }
    .info-panel p {
      font-size: 0.8rem; color: var(--text2); line-height: 1.5;
      margin-bottom: 10px;
    }
    .info-panel .meta { font-size: 0.7rem; color: var(--text2); }
    .info-panel .click-hint {
      margin-top: 8px; font-size: 0.68rem; color: rgba(226,182,79,0.6);
    }

    /* Hint at bottom */
    .hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; font-size: 0.7rem; color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
    }
    @media (max-width: 768px) {
      .overlay { padding: 16px; }
      .hero-title { font-size: 1.8rem; }
      .nav-links { display: none; }
      .legend { gap: 4px; }
      .legend-item { font-size: 0.65rem; padding: 4px 10px; }
    }
  </style>
</head>
<body>

<div class="overlay">
  <div class="top-bar">
    <a href="/cosmic-lens/" class="brand">
      <div class="brand-mark">🔭</div>

        <strong>宇宙之镜</strong>

    <div class="nav-links">

  <div class="bottom-bar">

</div>

<div class="info-panel" id="infoPanel">
  <div class="num" id="infoNum"></div>
  <h3 id="infoTitle"></h3>

  <div class="meta" id="infoMeta"></div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Course data ──
const courses = [
  { id:1, title:'模拟假说：我们是缸中之脑吗？', desc:'模拟假说三重论证、量子叠加/纠缠的代码解释、宇宙参数的精密调校', time:'35min', phase:0, icon:'🌌' },
  { id:2, title:'博斯特罗姆三难困境深度拆解', desc:'从哲学怀疑论到统计学论证，三命题展开、嵌套模拟倍增器', time:'40min', phase:0, icon:'🧩' },
  { id:3, title:'计算宇宙学：指令周期与内存限制', desc:'普朗克时间对应宇宙主频，贝肯斯坦界限对应内存，全息原理揭示信息边界', time:'45min', phase:0, icon:'⚡' },
  { id:4, title:'量子力学速通：叠加态·测量·退相干', desc:'双缝实验、叠加态、测量问题、四种诠释与退相干', time:'40min', phase:0, icon:'🌀' },
  { id:5, title:'量子纠缠与贝尔不等式', desc:'EPR悖论、CHSH不等式与2022诺奖实验，说明局域实在论为何被排除', time:'45min', phase:0, icon:'🔗' },
  { id:6, title:'物理常数的精密调校问题', desc:'26个自由参数、精细结构常数、暗能量微调、人择原理', time:'40min', phase:0, icon:'⚙️' },
  { id:7, title:'图灵完备宇宙', desc:'丘奇-图灵-多伊奇论题、康威生命游戏、数字物理学与it from bit', time:'50min', phase:0, icon:'💻' },
  { id:8, title:'信息守恒与黑洞', desc:'黑洞信息悖论、霍金辐射、面积熵、全息原理与萨斯坎德的黑洞战争', time:'45min', phase:0, icon:'🕳️' },
  { id:9, title:'暗能量与宇宙膨胀', desc:'1998加速膨胀、暗能量占比、状态方程、大冻结/大撕裂与哈勃张力之谜', time:'40min', phase:0, icon:'🌌' },
  { id:10, title:'多重世界 vs 哥本哈根', desc:'埃弗雷特多重世界、退相干历史、维格纳的朋友，唯一现实和无穷分支', time:'50min', phase:0, icon:'🌊' },
  { id:11, title:'人择原理', desc:'卡特人择原理、选择效应、弱/强人择、精细调校与多重宇宙推理', time:'45min', phase:1, icon:'🧭' },
  { id:12, title:'宇宙是量子计算机', desc:'Seth Lloyd宇宙计算上限、10^120次操作、10^90比特与贝肯斯坦界限', time:'50min', phase:1, icon:'⚛️' },
  { id:13, title:'计算的本质', desc:'图灵机、λ演算、Church-Turing论题、Rule 110 与计算等价性', time:'50min', phase:1, icon:'🧮' },
  { id:14, title:'康威生命游戏深潜', desc:'生命游戏四条规则、滑翔机、逻辑门、图灵完备与涌现复杂性', time:'50min', phase:1, icon:'⬛' },
  { id:15, title:'数字物理学', desc:'Wheeler 的 it from bit、信息本体论、数字物理、离散宇宙与可检验性', time:'50min', phase:1, icon:'🔢' },
  { id:16, title:'全息模拟论', desc:'全息原理、黑洞面积熵、AdS/CFT、量子纠错与二维编码三维空间', time:'50min', phase:1, icon:'🧊' },
  { id:17, title:'量子信息速通', desc:'qubit、量子门、纠缠、Grover算法、Shor算法与量子纠错', time:'55min', phase:1, icon:'🧬' },
  { id:18, title:'大过滤器理论', desc:'费米悖论、Drake方程、大过滤器、动物园假说、模拟沙盒与宇宙沉默', time:'45min', phase:1, icon:'🛸' },
  { id:19, title:'意识不可计算？', desc:'Penrose、《皇帝新脑》、Gödel论证、Orch-OR、意识不可计算与AI边界', time:'55min', phase:1, icon:'🧠' },
  { id:20, title:'阶段二总结', desc:'物理支柱 + 计算支柱、三支柱模型与模拟假说路线图', time:'45min', phase:1, icon:'🧱' },
];

const phaseColors = [
  new THREE.Color('#e2b64f'),        // Phase 0: 物理支柱 - gold
  new THREE.Color('#6b5ce7'),        // Phase 1: 计算支柱 - purple
];

// ── Scene setup ──
const container = document.getElementById('cosmos');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.5, 200);
camera.position.set(0, 8, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Orbit controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI * 0.75;
controls.target.set(0, 1, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;
controls.update();

// ── Lighting ──
const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.6);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xe2b64f, 80, 60, 1.5);
pointLight1.position.set(15, 10, 5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x6b5ce7, 40, 40, 1.5);
pointLight2.position.set(-10, -3, -8);
scene.add(pointLight2);

// ── Starfield ──
const starGeo = new THREE.BufferGeometry();
const starCount = 4000;
const starPositions = new Float32Array(starCount * 3);
const starColors = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);

for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 35 + Math.random() * 50;
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = r * Math.cos(phi);

  const colorChoice = Math.random();
  if (colorChoice < 0.1) {
    starColors[i * 3] = 0.89; starColors[i * 3 + 1] = 0.71; starColors[i * 3 + 2] = 0.31; // gold
  } else if (colorChoice < 0.2) {
    starColors[i * 3] = 0.42; starColors[i * 3 + 1] = 0.36; starColors[i * 3 + 2] = 0.91; // purple
  } else if (colorChoice < 0.35) {
    starColors[i * 3] = 0.6; starColors[i * 3 + 1] = 0.8; starColors[i * 3 + 2] = 1.0; // blue-white
  } else {
    starColors[i * 3] = 0.85; starColors[i * 3 + 1] = 0.85; starColors[i * 3 + 2] = 0.9;
  }
  starSizes[i] = Math.random() * 2.5 + 0.3;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

const starMat = new THREE.PointsMaterial({
  size: 0.12,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.85,
});
const starField = new THREE.Points(starGeo, starMat);
scene.add(starField);

// ── Nebula clouds ──
function createNebula(center, color, count, spread, size) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = center.x + (Math.random() - 0.5) * spread;
    pos[i * 3 + 1] = center.y + (Math.random() - 0.5) * spread * 0.5;
    pos[i * 3 + 2] = center.z + (Math.random() - 0.5) * spread;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size, color, blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, opacity: 0.35,
  });
  return new THREE.Points(geo, mat);
}

scene.add(createNebula(new THREE.Vector3(8, 1, -2), 0xe2b64f, 600, 8, 0.45));
scene.add(createNebula(new THREE.Vector3(-6, -2, 3), 0x6b5ce7, 500, 8, 0.4));
scene.add(createNebula(new THREE.Vector3(0, 3, -5), 0x4466aa, 400, 7, 0.35));

// ── Course nodes as glowing spheres ──
const courseNodes = [];
const courseGroup = new THREE.Group();
scene.add(courseGroup);

// Spiral distribution
function getSpiralPosition(index, phase, totalInPhase) {
  const baseAngle = phase === 0 ? Math.PI * 0.35 : Math.PI * 1.35;
  const angleSpread = Math.PI * 0.7;
  const t = index / Math.max(totalInPhase - 1, 1);
  const angle = baseAngle + t * angleSpread;
  const radius = 8 + (phase === 0 ? t * 5 : (1 - t) * 6);
  // Add some vertical variation
  const verticalOffset = Math.sin(t * Math.PI) * 2.5 + (phase === 0 ? -1 : 2);

  return {
    x: Math.cos(angle) * radius,
    y: verticalOffset,
    z: Math.sin(angle) * radius - 3,
  };
}

const phaseCounts = [10, 10]; // courses per phase
const phaseOffsets = [0, 10]; // start index per phase

courses.forEach((course, i) => {
  const phase = course.phase;
  const posInPhase = i - phaseOffsets[phase];
  const totalInPhase = phaseCounts[phase];
  const pos = getSpiralPosition(posInPhase, phase, totalInPhase);

  // Glow sphere (outer halo)
  const glowGeo = new THREE.SphereGeometry(0.55, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color: phaseColors[phase],
    transparent: true,
    opacity: 0.18,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);

  // Core sphere
  const coreGeo = new THREE.SphereGeometry(0.3, 32, 32);
  const coreMat = new THREE.MeshStandardMaterial({
    color: phaseColors[phase],
    emissive: phaseColors[phase],
    emissiveIntensity: 0.8,
    roughness: 0.3,
    metalness: 0.5,
  });
  const core = new THREE.Mesh(coreGeo, coreMat);

  // Ring
  const ringGeo = new THREE.TorusGeometry(0.42, 0.03, 16, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color: phaseColors[phase],
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.6;

  const group = new THREE.Group();
  group.add(glow);
  group.add(core);
  group.add(ring);
  group.position.set(pos.x, pos.y, pos.z);
  courseGroup.add(group);

  courseNodes.push({
    mesh: group,
    glow,
    core,
    ring,
    course,
    originalScale: 1,
    targetScale: 1,
  });
});

// ── Central core ──
const coreGlowGeo = new THREE.SphereGeometry(1.2, 64, 64);
const coreGlowMat = new THREE.MeshBasicMaterial({
  color: 0xe2b64f,
  transparent: true,
  opacity: 0.12,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const coreGlow = new THREE.Mesh(coreGlowGeo, coreGlowMat);
coreGlow.position.set(0, 1, 0);
scene.add(coreGlow);

const innerCoreGeo = new THREE.SphereGeometry(0.4, 64, 64);
const innerCoreMat = new THREE.MeshStandardMaterial({
  color: 0xe2b64f,
  emissive: 0xe2b64f,
  emissiveIntensity: 1.5,
  roughness: 0.2,
  metalness: 0.6,
});
const innerCore = new THREE.Mesh(innerCoreGeo, innerCoreMat);
innerCore.position.set(0, 1, 0);
scene.add(innerCore);

// ── Connection lines between courses in same phase ──
function drawPhaseConnections() {
  const lineGroup = new THREE.Group();

  [0, 1].forEach(phase => {
    const phaseNodes = courseNodes.filter(n => n.course.phase === phase);

    for (let i = 0; i < phaseNodes.length; i++) {
      for (let j = i + 1; j < phaseNodes.length; j++) {
        const a = phaseNodes[i].mesh.position;
        const b = phaseNodes[j].mesh.position;
        const dist = a.distanceTo(b);
        if (dist > 6) continue; // skip far connections

        const points = [a.clone(), b.clone()];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const lineMat = new THREE.LineBasicMaterial({
          color: phaseColors[phase],
          transparent: true,
          opacity: 0.06,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const line = new THREE.Line(lineGeo, lineMat);
        line.userData = { phase, opacity: 0.06 };
        lineGroup.add(line);
      }
    }
  });
  scene.add(lineGroup);
  return lineGroup;
}
const phaseLines = drawPhaseConnections();

// ── Coming-soon placeholder nodes (Phase 3 & 4) ──
function createPlaceholderNodes() {
  const group = new THREE.Group();
  const color3 = new THREE.Color(0x666680);
  const color4 = new THREE.Color(0x555570);

  // Phase 3: 模拟检测 (21-40) — 8 nodes
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI * 1.6 + (i / 7) * Math.PI * 0.7;
    const radius = 12 + i * 0.8;
    const pos = {
      x: Math.cos(angle) * radius,
      y: -1 + Math.sin(i * 0.8) * 2,
      z: Math.sin(angle) * radius - 3,
    };
    const geo = new THREE.SphereGeometry(0.2, 16, 16);
    const mat = new THREE.MeshBasicMaterial({
      color: color3,
      transparent: true,
      opacity: 0.15,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, pos.y, pos.z);
    group.add(mesh);
  }

  // Phase 4: 意识与伦理 (41-100) — outer ring
  for (let i = 0; i < 12; i++) {
    const angle = Math.PI * 0.9 + (i / 11) * Math.PI;
    const radius = 16 + i * 0.6;
    const pos = {
      x: Math.cos(angle) * radius,
      y: 2 + Math.sin(i * 0.5) * 1.5,
      z: Math.sin(angle) * radius - 3,
    };
    const geo = new THREE.SphereGeometry(0.18, 16, 16);
    const mat = new THREE.MeshBasicMaterial({
      color: color4,
      transparent: true,
      opacity: 0.1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, pos.y, pos.z);
    group.add(mesh);
  }

  scene.add(group);
  return group;
}
const placeholderNodes = createPlaceholderNodes();

// ── Hover / interaction ──
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.3;
const mouse = new THREE.Vector2();
let hoveredNode = null;
const infoPanel = document.getElementById('infoPanel');
const infoNum = document.getElementById('infoNum');
const infoTitle = document.getElementById('infoTitle');
const infoDesc = document.getElementById('infoDesc');
const infoMeta = document.getElementById('infoMeta');

function updateInfoPanel(node, screenX, screenY) {
  if (!node) {
    infoPanel.classList.remove('active');
    return;
  }
  const c = node.course;
  infoNum.textContent = `第 ${c.id} 课 · Phase ${c.phase + 1}`;
  infoTitle.textContent = `${c.icon} ${c.title}`;
  infoDesc.textContent = c.desc;
  infoMeta.textContent = `⏱ ${c.time} · 📖 5章 · 🧪 5练习`;
  infoPanel.style.left = screenX + 'px';
  infoPanel.style.top = screenY + 'px';
  infoPanel.classList.add('active');
}

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(
    courseNodes.map(n => n.core), false
  );

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const node = courseNodes.find(n => n.core === obj || n.glow === obj || n.ring === obj);
    if (node) {
      if (hoveredNode !== node) {
        // Reset previous
        if (hoveredNode) {
          hoveredNode.targetScale = 1;
          hoveredNode.glow.material.opacity = 0.18;
        }
        hoveredNode = node;
        node.targetScale = 1.8;
        node.glow.material.opacity = 0.5;
        document.body.style.cursor = 'pointer';
      }
      updateInfoPanel(node, e.clientX, e.clientY);
      return;
    }
  }

  // Nothing hit
  if (hoveredNode) {
    hoveredNode.targetScale = 1;
    hoveredNode.glow.material.opacity = 0.18;
    hoveredNode = null;
  }
  document.body.style.cursor = 'default';
  updateInfoPanel(null);
});

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(
    courseNodes.map(n => n.core), false
  );

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const node = courseNodes.find(n => n.core === obj || n.glow === obj || n.ring === obj);
    if (node) {
      const id = String(node.course.id).padStart(2, '0');
      window.location.href = `lesson${id}.html`;
    }
  }
});

// ── Animation loop ──
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  controls.update();

  // Animate node scales
  courseNodes.forEach(node => {
    const current = node.mesh.scale.x;
    const target = node.targetScale;
    node.mesh.scale.setScalar(current + (target - current) * 0.12);
    node.ring.rotation.z += 0.003;
    node.ring.rotation.x += 0.001;
  });

  // Pulse core
  const pulse = 1 + Math.sin(t * 0.8) * 0.15;
  coreGlow.scale.setScalar(pulse);
  innerCore.material.emissiveIntensity = 1.5 + Math.sin(t * 1.2) * 0.5;

  // Rotate starfield very slowly
  starField.rotation.y += 0.0001;
  starField.rotation.x += 0.00005;

  // Fade lines based on camera distance
  const camDist = camera.position.length();
  phaseLines.children.forEach(line => {
    const phase = line.userData.phase;
    const baseOpacity = line.userData.opacity;
    line.material.opacity = baseOpacity * Math.min(1, 20 / camDist);
  });

  renderer.render(scene, camera);
}

animate();

// ── Responsive ──
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ── Touch support ──
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
  }
}, { passive: true });
</script>
