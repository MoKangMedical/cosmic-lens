  <style>
    :root {
      --bg: #020408;
      --gold: #e2b64f;
      --gold-light: #f0d478;
      --gold-dark: #b8922e;
      --text: #f5f5f7;
      --text2: #a0a0ab;
      --serif: 'Noto Serif SC', serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--text); }

    #cosmos { position: fixed; inset: 0; z-index: 0; }

    /* Overlay */
    .overlay {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 28px 36px 24px;
    }
    .overlay > * { pointer-events: auto; }

    /* Top bar */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--text);
    }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 14px;
      display: grid; place-items: center; font-size: 1.3rem;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.75), transparent 16%),
                  linear-gradient(135deg, var(--gold), #6b5ce7);
      box-shadow: 0 0 32px rgba(226,182,79,0.35);
    }
    .brand-text { line-height: 1.15; }
    .brand-text strong {
      display: block; font-size: 1.02rem; letter-spacing: 0;
      font-family: var(--serif);
    }
    .brand-text span {
      font-size: 0.68rem; color: var(--text2); text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .nav-links { display: flex; gap: 6px; }
    .nav-links a {
      color: var(--text2); text-decoration: none; font-size: 0.85rem;
      padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.25s;
    }
    .nav-links a:hover {
      color: var(--text); background: rgba(255,255,255,0.1);
      border-color: rgba(226,182,79,0.25);
    }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 0 20px;
      border-radius: 999px; font-size: 0.85rem; font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #111; border: none;
      box-shadow: 0 8px 28px rgba(226,182,79,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 12px 36px rgba(226,182,79,0.35); }

    /* Bottom info */
    .bottom-bar {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px;
    }
    .hero-title {
      font-family: var(--serif); font-weight: 900;
      font-size: clamp(2.4rem, 5.5vw, 4.8rem);
      line-height: 1.05; letter-spacing: 0;
      text-shadow: 0 0 60px rgba(226,182,79,0.25);
    }
    .hero-title span { color: var(--gold); }
    .hero-sub {
      margin-top: 10px; color: var(--text2); font-size: 0.95rem;
      max-width: 520px; line-height: 1.5;
    }

    /* Phase legend */
    .legend {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.75rem; color: var(--text2);
      background: rgba(10,10,16,0.8); padding: 6px 14px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,0.06);
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* Course info tooltip */
    .info-panel {
      position: fixed; z-index: 20;
      pointer-events: none; opacity: 0;
      transform: translate(-50%, -130%);
      background: rgba(12,12,20,0.92);
      border: 1px solid rgba(226,182,79,0.2);
      border-radius: 16px; padding: 18px 22px;
      max-width: 320px;
      transition: opacity 0.2s;
      backdrop-filter: blur(16px);
    }
    .info-panel.active { opacity: 1; }
    .info-panel .num {
      font-size: 0.7rem; color: var(--gold);
      text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 4px;
    }
    .info-panel h3 {
      font-family: var(--serif); font-size: 1.05rem;
      color: var(--gold); line-height: 1.3; margin-bottom: 6px;
    }
    .info-panel p {
      font-size: 0.8rem; color: var(--text2); line-height: 1.5;
      margin-bottom: 10px;
    }
    .info-panel .meta { font-size: 0.7rem; color: var(--text2); }
    .info-panel .click-hint {
      margin-top: 8px; font-size: 0.68rem; color: rgba(226,182,79,0.6);
    }

    /* Hint at bottom */
    .hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; font-size: 0.7rem; color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
    }
    @media (max-width: 768px) {
      .overlay { padding: 16px; }
      .hero-title { font-size: 1.8rem; }
      .nav-links { display: none; }
      .legend { gap: 4px; }
      .legend-item { font-size: 0.65rem; padding: 4px 10px; }
    }

    /* Comet hover glow label */
    .comet-label {
      position: fixed; z-index: 20; pointer-events: none;
      font-family: var(--serif); font-size: 0.75rem; color: var(--gold-light);
      text-shadow: 0 0 16px rgba(226,182,79,0.7), 0 0 4px rgba(255,255,255,0.5);
      transform: translate(-50%, -180%);
      white-space: nowrap; opacity: 0; transition: opacity 0.2s;
    }
    .comet-label.active { opacity: 1; }
  </style>
</head>

function createGlowTexture(innerColor, outerColor, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  gradient.addColorStop(0, innerColor);
  gradient.addColorStop(0.3, innerColor);
  gradient.addColorStop(0.7, outerColor);
  gradient.addColorStop(1, 'transparent');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

function createNebulaSprite(texture, color, size, opacity) {
  const mat = new THREE.SpriteMaterial({
    map: texture,
    color: color,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: opacity,
  });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(size, size, 1);
  return sprite;
}

// -- Galactic disk (thin flat layer of background stars) --
function createGalacticDisk(innerRadius, outerRadius, count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    // Bias toward center with sqrt distribution
    const r = innerRadius + Math.random() * (outerRadius - innerRadius);
    pos[i * 3] = Math.cos(angle) * r;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 1.2;
    pos[i * 3 + 2] = Math.sin(angle) * r;

    // Dim blue-white
    const b = 0.5 + Math.random() * 0.5;
    colors[i * 3] = 0.5 + b * 0.3;
    colors[i * 3 + 1] = 0.5 + b * 0.35;
    colors[i * 3 + 2] = 0.6 + b * 0.4;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.08,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.5,
  });
  return new THREE.Points(geo, mat);
}

// -- Spiral Arms (4 main arms using logarithmic spiral) --
function createSpiralArm(armOffset, count, spread, armColor, lengthScale) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  const colorObj = new THREE.Color(armColor);

  for (let i = 0; i < count; i++) {
    // Logarithmic spiral: r = a * e^(b*theta)
    const t = i / count; // 0 to 1 from center to edge
    const angle = armOffset + t * Math.PI * 2.4; // ~1.2 full turns
    const r = 0.6 + t * 16 * lengthScale;

    // Spread perpendicular to spiral
    const spreadAmount = (Math.random() - 0.5) * spread * (0.3 + t * 1.0);
    const perpAngle = angle + Math.PI / 2;

    pos[i * 3] = Math.cos(angle) * r + Math.cos(perpAngle) * spreadAmount;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.6 * (0.3 + t * 1.0);
    pos[i * 3 + 2] = Math.sin(angle) * r + Math.sin(perpAngle) * spreadAmount;

    // Color: brighter toward center, dimmer toward edge
    const brightness = 1.0 - t * 0.6;
    colors[i * 3] = colorObj.r * brightness;
    colors[i * 3 + 1] = colorObj.g * brightness;
    colors[i * 3 + 2] = colorObj.b * brightness;
    sizes[i] = (0.04 + Math.random() * 0.1) * (1.2 - t * 0.8);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Use ShaderMaterial for variable-size points
  const mat = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.75,
  });
  return new THREE.Points(geo, mat);
}

// -- Dust lanes between arms (darker regions) --
function createDustLane(armOffset, count, lengthScale) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const t = i / count;
    const angle = armOffset + Math.PI / 4 + t * Math.PI * 2.2; // offset between arms
    const r = 1.5 + t * 15 * lengthScale;
    const spread = (Math.random() - 0.5) * 3.5 * (0.3 + t);
    const perpAngle = angle + Math.PI / 2;
    pos[i * 3] = Math.cos(angle) * r + Math.cos(perpAngle) * spread;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
    pos[i * 3 + 2] = Math.sin(angle) * r + Math.sin(perpAngle) * spread;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.12,
    color: 0x331133,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.2,
  });
  return new THREE.Points(geo, mat);
}

function createGlobularCluster(center, radius, count, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = Math.pow(Math.random(), 0.6) * radius; // bias toward center
    pos[i * 3] = center.x + r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = center.y + r * Math.sin(phi) * Math.sin(theta);

  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    color: color,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.7,
  });
  return new THREE.Points(geo, mat);
}

function createStarLayer(radius, count, size, opacity, colorMix) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = radius + (Math.random() - 0.5) * radius * 0.6;
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);

    const mix = Math.random();
    if (mix < colorMix[0]) {
      colors[i * 3] = 0.89; colors[i * 3 + 1] = 0.71; colors[i * 3 + 2] = 0.31; // gold
    } else if (mix < colorMix[1]) {
      colors[i * 3] = 0.42; colors[i * 3 + 1] = 0.36; colors[i * 3 + 2] = 0.91; // purple
    } else if (mix < colorMix[2]) {
      colors[i * 3] = 0.5; colors[i * 3 + 1] = 0.7; colors[i * 3 + 2] = 1.0; // blue
    } else {
      const w = 0.6 + Math.random() * 0.4;
      colors[i * 3] = w; colors[i * 3 + 1] = w; colors[i * 3 + 2] = w * 1.05;
    }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size, vertexColors: true, blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, opacity,
  });
  return new THREE.Points(geo, mat);
}

// Enhanced spiral distribution — nodes follow galaxy arms
function getCoursePosition(index, phase, totalInPhase) {
  // Phase 0 (gold): right quadrant  (0°)
  // Phase 1 (purple): top quadrant  (90°)
  // Phase 2 (cyan): left quadrant  (180°)
  // Phase 3 (violet): bottom quadrant (270°)
  // Phase 4 (amber): outer scattered ring (mixed angles)
  const phaseAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5, -1];
  const phaseRadiusStart = [3, 4, 5, 6, 8];
  const phaseRadiusRange = [11, 11, 11, 11, 14];
  const phaseYBase = [-1, 0.5, 2, 3.5, 5];

  const t = totalInPhase <= 1 ? 0.5 : index / (totalInPhase - 1);
  const radius = phaseRadiusStart[phase] + t * phaseRadiusRange[phase];
  // Phase 4 gets scattered placement around the outer galaxy
  let armAngle;
  if (phaseAngles[phase] < 0) {
    armAngle = (index / totalInPhase) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
  } else {
    armAngle = phaseAngles[phase] + t * Math.PI * 0.8;
  }
  const spread = (index % 2 === 0 ? 1 : -1) * (0.8 + t * 1.2);

  const perpAngle = armAngle + Math.PI / 2;
  const flatX = Math.cos(armAngle) * radius + Math.cos(perpAngle) * spread;
  const flatZ = Math.sin(armAngle) * radius + Math.sin(perpAngle) * spread;
  const y = phaseYBase[phase] + Math.sin(t * Math.PI) * 1.8;

  return { x: flatX, y, z: flatZ };
}

// 5 phases: 20+20+40+20+20 = 120 courses
const phaseCounts = [20, 20, 40, 20, 20];
const phaseOffsets = [0, 20, 40, 80, 100];

// Comet trail configuration per phase
const phaseTrailLengths = [8, 8, 6, 5, 9];  // trail segments
const phaseSpeeds = [0.3, 0.25, 0.2, 0.15, 0.12];  // orbit speed

courses.forEach((course, i) => {
  const phase = course.phase;
  const posInPhase = i - phaseOffsets[phase];
  const totalInPhase = phaseCounts[phase];
  const pos = getCoursePosition(posInPhase, phase, totalInPhase);
  const color = phaseColors[phase];

  // ── COMET HEAD ──
  // Bright core
  const coreGeo = new THREE.SphereGeometry(0.28, 32, 32);
  const coreMat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 1.2,
    roughness: 0.15, metalness: 0.6,
  });
  const core = new THREE.Mesh(coreGeo, coreMat);

  // Inner glow
  const glowGeo = new THREE.SphereGeometry(0.55, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);

  // Outer aura
  const auraGeo = new THREE.SphereGeometry(0.85, 32, 32);
  const auraMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.08,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const aura = new THREE.Mesh(auraGeo, auraMat);

  // Orbit ring (thinner, more elegant)
  const ringGeo = new THREE.TorusGeometry(0.65, 0.03, 12, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.6;

  // ── COMET TRAIL ──
  const trailLen = phaseTrailLengths[phase];
  const trailPoints = [];
  const trailColors = [];
  const trailSizes = [];
  for (let t = 0; t < trailLen; t++) {
    // Trails start behind the comet (negative direction of orbit)
    const alpha = 1 - t / trailLen;
    trailPoints.push(pos.x, pos.y, pos.z);
    trailColors.push(color.r * alpha, color.g * alpha, color.b * alpha);
    trailSizes.push(0.12 * alpha * alpha);  // quadratic falloff
  }
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(trailPoints), 3));
  trailGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(trailColors), 3));
  const trailMat = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.7,
  });
  const trail = new THREE.Points(trailGeo, trailMat);

  const group = new THREE.Group();
  group.add(aura);
  group.add(glow);
  group.add(core);
  group.add(ring);
  group.add(trail);
  group.position.set(pos.x, pos.y, pos.z);
  group.userData = {
    phase,
    orbitAngle: Math.random() * Math.PI * 2,
    orbitSpeed: phaseSpeeds[phase] * (0.8 + Math.random() * 0.4),
    orbitRadius: Math.sqrt(pos.x * pos.x + pos.z * pos.z),
    orbitBaseY: pos.y,
    orbitAmp: 0.3 + Math.random() * 0.7,
    trailLen,
    trail,
    trailMat,
    trailGeo,
  };

  group.children.forEach(child => {
    child.userData = { phase };
  });

  courseGroup.add(group);

  courseNodes.push({
    mesh: group,
    glow,
    core,
    ring,
    aura,
    trail,
    course,
    targetScale: 1,
    hovered: false,
  });
});

function drawPhaseConnections() {
  const lineGroup = new THREE.Group();

  [0, 1, 2, 3, 4].forEach(phase => {
    const phaseNodes = courseNodes.filter(n => n.course.phase === phase);

    for (let i = 0; i < phaseNodes.length; i++) {
      for (let j = i + 1; j < phaseNodes.length; j++) {
        // Only connect 1/4 of pairs to avoid visual clutter
        if ((j - i) % 4 !== 0) continue;
        const a = phaseNodes[i].mesh.position;
        const b = phaseNodes[j].mesh.position;
        const dist = a.distanceTo(b);
        if (dist > 7) continue;

        const points = [a.clone(), b.clone()];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const lineMat = new THREE.LineBasicMaterial({
          color: phaseColors[phase],
          transparent: true, opacity: 0.05,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const line = new THREE.Line(lineGeo, lineMat);
        line.userData = { phase, opacity: 0.05 };
        lineGroup.add(line);
      }
    }
  });
  scene.add(lineGroup);
  return lineGroup;
}

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(
    courseNodes.map(n => n.core), false
  );

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const node = courseNodes.find(n => n.core === obj || n.glow === obj || n.ring === obj || n.aura === obj);
    if (node) {
      if (hoveredNode !== node) {
        if (hoveredNode) {
          hoveredNode.targetScale = 0.85;
          hoveredNode.glow.material.opacity = 0.25;
        }
        hoveredNode = node;
        node.targetScale = 2.0;
        node.glow.material.opacity = 0.65;
        document.body.style.cursor = 'pointer';
      }
      updateInfoPanel(node, e.clientX, e.clientY);

    }
  }

  if (hoveredNode) {
    hoveredNode.targetScale = 0.85;
    hoveredNode.glow.material.opacity = 0.25;

  }
  document.body.style.cursor = 'default';

// ══════════════════════════════════════════════════════
//  ANIMATION LOOP
// ══════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  controls.update();

  // ── COURSE NODE COMET ANIMATION ──
  courseNodes.forEach(node => {
    const mesh = node.mesh;
    const ud = mesh.userData;

    // Smooth scale
    const current = mesh.scale.x;
    const target = node.targetScale || 0.85;
    mesh.scale.setScalar(current + (target - current) * 0.08);

    // Ring rotation (more pronounced for comets)
    node.ring.rotation.z += 0.006;
    node.ring.rotation.x += 0.002;

    // Orbital motion (each comet slowly orbits, leaving a trail)
    if (ud.orbitSpeed !== undefined) {
      ud.orbitAngle += ud.orbitSpeed * 0.001;
      const r = ud.orbitRadius;
      const a = ud.orbitAngle;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      const y = ud.orbitBaseY + Math.sin(a * 2.3) * ud.orbitAmp;
      mesh.position.set(x, y, z);

      // Update trail: shift points backward
      const tPos = ud.trailGeo.attributes.position.array;
      const tLen = ud.trailLen;
      // Shift all points down by 3 (shift toward tail)
      for (let i = (tLen - 1) * 3; i >= 3; i -= 3) {
        tPos[i] = tPos[i - 3];
        tPos[i + 1] = tPos[i - 4];
        tPos[i + 2] = tPos[i - 5];
      }
      // New head position (slightly behind current position, in world space)
      const dx = Math.sin(a) * ud.orbitSpeed * 0.15;
      const dz = -Math.cos(a) * ud.orbitSpeed * 0.15;
      tPos[0] = -dx;
      tPos[1] = 0;
      tPos[2] = -dz;
      ud.trailGeo.attributes.position.needsUpdate = true;
    }
  });

  // ── DECORATIVE COMETS ──
  decorativeComets.forEach(comet => {
    comet.orbitAngle += comet.orbitSpeed * 0.003;
    const a = comet.orbitAngle;
    const r = comet.orbitRadius;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    const y = comet.yBase + Math.sin(a * 1.7 + comet.orbitTilt) * comet.yAmp;

    // Update head position
    comet.group.position.set(x, y, z);

    // Update trail
    const tPos = comet.trailGeo.attributes.position.array;
    const tLen = comet.trailLen;
    for (let i = (tLen - 1) * 3; i >= 3; i -= 3) {
      tPos[i] = tPos[i - 3];
      tPos[i + 1] = tPos[i - 4];
      tPos[i + 2] = tPos[i - 5];
    }
    // New position (relative to comet, which moves)
    const speed = comet.orbitSpeed * 0.4;
    tPos[0] = -Math.sin(a) * speed;
    tPos[1] = -Math.cos(a * 1.7 + comet.orbitTilt) * comet.yAmp * 0.05;
    tPos[2] = Math.cos(a) * speed;
    comet.trailGeo.attributes.position.needsUpdate = true;
  });

  // ── FLOATING DUST ──
  const dustPosArr = dustGeo.attributes.position.array;
  for (let i = 0; i < dustCount; i++) {
    const d = dustData[i];
    const baseIdx = i * 3;
    const r = Math.sqrt(dustPosArr[baseIdx] * dustPosArr[baseIdx] + dustPosArr[baseIdx + 2] * dustPosArr[baseIdx + 2]);
    const angle = Math.atan2(dustPosArr[baseIdx + 2], dustPosArr[baseIdx]) + d.orbitSpeed * 0.001;
    dustPosArr[baseIdx] = Math.cos(angle) * r;
    dustPosArr[baseIdx + 2] = Math.sin(angle) * r;
    dustPosArr[baseIdx + 1] = d.baseY + Math.sin(t * 0.5 + d.yPhase) * d.yAmp;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // Pulse central core
  const pulse = 1 + Math.sin(t * 0.7) * 0.2;
  coreGlowOuter.scale.setScalar(pulse);
  coreGlowMid.scale.setScalar(pulse * 1.1);
  coreGlowInner.scale.setScalar(pulse * 1.15);
  innerCore.material.emissiveIntensity = 1.8 + Math.sin(t * 1.1) * 0.6;

  // Slowly rotate background star layers
  scene.children.forEach(child => {
    if (child.type === 'Points' && !child.isNodeRelated) {
      // slight rotation on deep star layers
    }
  });

  // Subtle nebula pulsing
  nebulae.forEach((n, i) => {
    n.sprite.material.opacity = n.baseOpacity * (0.85 + Math.sin(t * 0.3 + i) * 0.15);
    n.sprite.scale.x = n.sprite.scale.y * (1 + Math.sin(t * 0.25 + i * 1.5) * 0.03);
  });

  // Rotate spiral arms very slowly (safe — skip if groups don't exist)
  if (typeof armsGroup !== 'undefined') armsGroup.rotation.z += 0.0001;
  if (typeof dustGroup !== 'undefined') dustGroup.rotation.z += 0.00008;

  // Connection lines fade with camera distance
  const camDist = camera.position.length();
  phaseLines.children.forEach(line => {
    line.material.opacity = line.userData.opacity * Math.min(1, 22 / camDist);
  });

  renderer.render(scene, camera);
}

animate();

// ── Responsive ──
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ── Touch support ──
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
  }
}, { passive: true });
</script>
</body>
</html>
