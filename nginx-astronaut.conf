# ============================================
# 宇航员视角 · 总观效应 — Nginx 配置
# ============================================
# 用法：
#   作为独立站点：   server_name astronaut.example.com;
#   作为子路径：     location /astronaut/ { alias ...; }
# ============================================

server {
    listen 80;
    server_name astronaut.local;

    root /Users/apple/Desktop/OPC/cosmic-lens/docs;
    index index.html;

    # 字符集
    charset utf-8;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 主页面路由
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 宇航员模块 —— 全部 6 个页面
    location = /astronaut            { try_files /astronaut.html =404; }
    location = /stories              { try_files /astronaut-stories.html =404; }
    location = /philosophy           { try_files /astronaut-philosophy.html =404; }
    location = /journal              { try_files /astronaut-journal.html =404; }
    location = /gallery              { try_files /astronaut-gallery.html =404; }
    location = /timeline             { try_files /astronaut-timeline.html =404; }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

